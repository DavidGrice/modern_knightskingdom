name: CI

# Runs on every pull request into main, on main itself after a merge, AND on
# a direct push to a properly-named branch.
#
# That third trigger is load-bearing, not a convenience: auto-pr.yml opens
# PRs using the default GITHUB_TOKEN, and GitHub's loop-prevention rule means
# an event caused by GITHUB_TOKEN (like that PR opening) does NOT trigger
# other workflows — so the `pull_request` trigger above never fires for an
# auto-opened PR, and it would sit forever with no check to satisfy the
# ruleset. Running on `push` instead uses the pusher's own credentials, which
# has no such restriction, and GitHub matches a REQUIRED status check by
# (commit SHA, check name), not by which event produced it — so the result
# from this push-triggered run still satisfies the PR once auto-pr.yml opens
# one for the same SHA, whichever order the two runs finish in.
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'enhancement/**'
      - 'bugfix/**'
      - 'chore/**'
      - 'docs/**'

# A new push to a PR cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch prefix
        run: |
          # head_ref is set for pull_request events (the PR's source branch);
          # ref_name is set for push events (just the branch name, no
          # refs/heads/ prefix). Exactly one of the two is non-empty per run.
          branch="${{ github.head_ref || github.ref_name }}"
          if [ "$branch" = "main" ]; then
            echo "On main — nothing to check."
            exit 0
          fi
          echo "Branch: $branch"
          if [[ "$branch" =~ ^(feature|enhancement|bugfix|chore|docs)/[a-z0-9._-]+$ ]]; then
            echo "OK"
          else
            echo "::error::'$branch' does not match <type>/<slug>."
            echo "::error::Allowed types: feature, enhancement, bugfix, chore, docs."
            echo "::error::Slug must be lowercase: letters, digits, dot, underscore, hyphen."
            exit 1
          fi

  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` needs package-lock.json to be in sync with package.json;
      # it fails loudly rather than silently resolving something else.
      - name: Install
        run: npm ci

      # The repo is strict TypeScript with no lint config, so tsc IS the
      # linter. It runs before the build because its errors are far more
      # legible than the ones the bundler produces for the same mistake.
      - name: Typecheck
        run: npx tsc --noEmit

      # Note this passes without public/assets: the extracted models,
      # textures and sounds are runtime fetches from public/, not build
      # inputs. The catalog JSON that IS a build input lives in
      # src/game/data/*.generated.json and is committed.
      - name: Build
        run: npx next build
